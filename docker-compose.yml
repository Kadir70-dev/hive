services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hive
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d hive"]
      interval: 10s
      retries: 5
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    restart: unless-stopped
    volumes: ["redis_data:/data"]
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://hive:${POSTGRES_PASSWORD}@db:5432/hive?sslmode=disable
      COOKIE_SECURE: "true"
      PUBLIC_ORIGIN: https://thehivesociety.ae
    depends_on:
      db: {condition: service_healthy}
    expose: ["8080"]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

# Hetzner VPS stack. Run with secrets from an untracked env file:
#   docker compose --env-file backend/.env up -d --build
# Staging: docker compose --env-file backend/.env.staging -p hive-staging up -d --build
# (same file; staging differs only by environment, see docs/operations/staging.md)
# Only Caddy publishes ports; PostgreSQL and Redis stay on the private network.
name: hive

# Bounded log storage: Caddy access logs contain client IP addresses.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-database-url: &database-url postgres://hive:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/hive?sslmode=disable

services:
  db:
    logging: *logging
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hive
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d hive"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    logging: *logging
    image: redis:7-alpine
    restart: unless-stopped
    # The password is passed via env, not argv, so it is not visible in `ps`.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy volatile-ttl --requirepass \"$$REDIS_PASSWORD\""]
    volumes: ["redis_data:/data"]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  # One-shot schema migration. The API only starts after it exits 0, so a
  # failed migration stops the deploy. It never resets or drops data.
  migrate:
    logging: *logging
    build: ./backend
    entrypoint: ["/usr/local/bin/migrate", "up"]
    restart: "no"
    environment:
      DATABASE_URL: *database-url
    networks: [internal]
    depends_on:
      db: {condition: service_healthy}

  api:
    logging: *logging
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
      COOKIE_SECURE: "true"
      # CSRF allow-list: the site origin(s) that call the API through the Netlify proxy.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://thehivesociety.ae}
      # Only Caddy may supply X-Forwarded-For; see backend/internal/clientip.
      TRUSTED_PROXY_CIDRS: ${HIVE_CADDY_IP:-10.250.70.10}/32
      HIVE_PROXY_SHARED_SECRET: ${HIVE_PROXY_SHARED_SECRET:?set HIVE_PROXY_SHARED_SECRET}
      PASSWORD_HASH_CONCURRENCY: "4"
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://thehivesociety.ae}
      # Transactional email (Resend). Sending domain must be verified in Resend
      # on a dedicated subdomain first; Titan MX/SPF/DMARC stay untouched.
      MAIL_PROVIDER: ${MAIL_PROVIDER:?set MAIL_PROVIDER (resend or log)}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_REPLY_TO: hello@thehivesociety.ae
      # 32 random bytes, base64. Encrypts admin TOTP secrets at rest.
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?set MFA_ENCRYPTION_KEY}
      # Only these verified addresses can be promoted with the admin CLI.
      HIVE_ADMIN_EMAILS: meeraahbabi@gmail.com,hello@thehivesociety.ae
    expose: ["8080"]
    networks: [internal]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    stop_grace_period: 25s

  # Encrypted nightly backups (see docs/operations/backup-and-restore.md).
  # Only the age PUBLIC key is on the server; the private key stays offline.
  backup:
    logging: *logging
    build: ./ops/backup
    restart: unless-stopped
    command: ["cron"]
    environment:
      PGHOST: db
      PGUSER: hive
      PGDATABASE: hive
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?set BACKUP_AGE_RECIPIENT (age public key)}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-15 22 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      # Off-site copy (strongly recommended), e.g. Hetzner Storage Box or R2.
      # Configure the remote with RCLONE_CONFIG_OFFSITE_* variables in backend/.env.
      BACKUP_RCLONE_REMOTE: ${BACKUP_RCLONE_REMOTE:-}
      RCLONE_CONFIG_OFFSITE_TYPE: ${RCLONE_CONFIG_OFFSITE_TYPE:-}
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${RCLONE_CONFIG_OFFSITE_PROVIDER:-}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${RCLONE_CONFIG_OFFSITE_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY:-}
    volumes:
      - backups:/backups
    tmpfs:
      - /work:size=2g,mode=0700
    networks: [internal]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/usr/local/bin/entrypoint.sh", "healthy"]
      interval: 1h
      start_period: 30h
      retries: 1

  caddy:
    logging: *logging
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.thehivesociety.ae}
      ACME_EMAIL: ${ACME_EMAIL:-hello@thehivesociety.ae}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      internal:
        ipv4_address: ${HIVE_CADDY_IP:-10.250.70.10}
    depends_on:
      api: {condition: service_healthy}

networks:
  internal:
    ipam:
      config:
        - subnet: ${HIVE_DOCKER_SUBNET:-10.250.70.0/24}

volumes:
  backups:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

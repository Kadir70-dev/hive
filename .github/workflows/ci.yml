name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only-test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verify dependencies
        run: |
          go mod download
          go mod verify
          go mod tidy -diff
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go build ./...
      - name: Start authenticated local SeaweedFS (test-only S3)
        run: |
          docker run -d --name hive-s3 --pull always \
            -p 127.0.0.1:8333:8333 \
            -v "$GITHUB_WORKSPACE/scripts/ci/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:latest server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data
          for i in $(seq 1 40); do
            if curl -sS -o /dev/null http://127.0.0.1:8333/; then exit 0; fi
            sleep 2
          done
          docker logs hive-s3
          exit 1
      - name: Test (race detector, PostgreSQL and authenticated S3 integration)
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-only-test-password@localhost:5432/postgres?sslmode=disable
          TEST_S3_ENDPOINT: http://127.0.0.1:8333
          TEST_S3_ACCESS_KEY: hive-ci-access-key
          TEST_S3_SECRET_KEY: hive-ci-secret-key-not-for-production
        run: go test -race -count=1 ./...
      - name: Verify S3 tests ran rather than skipped
        env:
          TEST_S3_ENDPOINT: http://127.0.0.1:8333
          TEST_S3_ACCESS_KEY: hive-ci-access-key
          TEST_S3_SECRET_KEY: hive-ci-secret-key-not-for-production
        run: |
          go test -v ./internal/storage -run '^TestS3' | tee /tmp/s3-test.log
          ! grep -q -- '--- SKIP' /tmp/s3-test.log

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Production build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          HIVE_API_INTERNAL_URL: https://api.example.invalid
        run: npm run build
      - name: Security headers smoke test (production server)
        env:
          HIVE_API_INTERNAL_URL: http://127.0.0.1:9
        run: |
          npx next start -p 3917 > next.log 2>&1 &
          for i in $(seq 1 30); do curl -fs -o /dev/null http://127.0.0.1:3917/auth && break; sleep 1; done
          page=$(curl -fsS -D - -o page.html http://127.0.0.1:3917/auth)
          echo "$page" | grep -qi "content-security-policy:.*'nonce-.*'strict-dynamic'"
          echo "$page" | grep -qi '^x-frame-options: DENY'
          echo "$page" | grep -qi '^strict-transport-security: max-age='
          grep -q 'nonce="' page.html
          curl -fsS -D - -o /dev/null http://127.0.0.1:3917/hive.html | grep -qi "content-security-policy:.*'sha256-"
          curl -sS -D - -o /dev/null http://127.0.0.1:3917/api/backend/me | grep -qi "content-security-policy: default-src 'none'"
          if curl -sS -D - -o /dev/null http://127.0.0.1:3917/auth | grep -qi '^x-powered-by'; then echo "x-powered-by leaked"; exit 1; fi

  infrastructure:
    name: Infrastructure (Compose, Docker, migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only-test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Dummy values for config validation only; never real secrets.
      POSTGRES_PASSWORD: ci-dummy
      REDIS_PASSWORD: ci-dummy
      HIVE_PROXY_SHARED_SECRET: ci-dummy-secret-not-used-anywhere-0123
      SITE_DOMAIN: staging.example.test
      MAIL_PROVIDER: log
      MFA_ENCRYPTION_KEY: Y2ktZHVtbXkta2V5LW5vdC1hLXNlY3JldC0wMTIzNDU=
      BACKUP_AGE_RECIPIENT: age1ci-dummy-not-a-key
      PGPASSWORD: ci-only-test-password
      PGHOST: localhost
      PGUSER: postgres
      DB_BASE: postgres://postgres:ci-only-test-password@localhost:5432
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: docker compose config -q
      - name: Validate Hostinger single-server overlay
        run: docker compose -f docker-compose.yml -f docker-compose.hostinger.yml config -q
      - name: Validate Caddy configuration
        run: |
          docker run --rm -e API_DOMAIN=api.example.test -e ACME_EMAIL=ops@example.test -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm -e SITE_DOMAIN=staging.example.test -e ACME_EMAIL=ops@example.test -v "$PWD/Caddyfile.hostinger:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build backend and backup images
        run: |
          docker build -t hive-api:ci backend
          docker build -t hive-backup:test ops/backup
          docker build -f Dockerfile.web -t hive-web:ci .
      - name: Migrate a fresh database twice (second run must be a no-op)
        run: |
          psql -c 'CREATE DATABASE hive_fresh'
          DB="$DB_BASE/hive_fresh?sslmode=disable"
          docker run --rm --network host -e DATABASE_URL="$DB" --entrypoint migrate hive-api:ci up
          docker run --rm --network host -e DATABASE_URL="$DB" --entrypoint migrate hive-api:ci up | tee second-run.txt
          grep -q 'no pending migrations' second-run.txt
          docker run --rm --network host -e DATABASE_URL="$DB" --entrypoint migrate hive-api:ci status
      - name: Admin CLI refuses unverified or non-allowlisted accounts
        run: |
          DB="$DB_BASE/hive_fresh?sslmode=disable"
          psql -d hive_fresh -c "INSERT INTO users(email,password_hash,first_name) VALUES('owner@example.test','x','Owner')"
          run_admin() { docker run --rm --network host -e DATABASE_URL="$DB" -e HIVE_ADMIN_EMAILS=owner@example.test --entrypoint admin hive-api:ci "$@"; }
          if run_admin promote --email owner@example.test; then echo "promoted an unverified account"; exit 1; fi
          if run_admin promote --email someone@example.test; then echo "promoted a non-allowlisted account"; exit 1; fi
          psql -d hive_fresh -c "UPDATE users SET email_verified_at=now() WHERE email='owner@example.test'"
          run_admin promote --email owner@example.test
          run_admin list | grep -q 'owner@example.test verified=true mfa=false'
      - name: Encrypted backup, retention, restore, verify and tamper detection
        env:
          PGPORT: "5432"
        run: ops/backup/test-backup-restore.sh
      - name: Upgrade a database created from the legacy manual schema
        run: |
          psql -c 'CREATE DATABASE hive_legacy'
          psql -d hive_legacy -v ON_ERROR_STOP=1 -f backend/migrations/testdata/legacy_001_init.sql
          docker run --rm --network host -e DATABASE_URL="$DB_BASE/hive_legacy?sslmode=disable" --entrypoint migrate hive-api:ci up
      - name: API refuses to start on an unmigrated database
        run: |
          psql -c 'CREATE DATABASE hive_empty'
          if docker run --rm --network host -e DATABASE_URL="$DB_BASE/hive_empty?sslmode=disable" hive-api:ci; then
            echo "API started against an unmigrated database"; exit 1
          fi
      - name: API becomes ready on the migrated database
        run: |
          docker run -d --name api --network host -e PORT=18099 -e COOKIE_SECURE=false -e MAIL_PROVIDER=log \
            -e DATABASE_URL="$DB_BASE/hive_fresh?sslmode=disable" hive-api:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:18099/ready && exit 0; sleep 1; done
          docker logs api
          exit 1

  proxy-e2e:
    name: End-to-end (Next.js proxy -> Go API)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only-test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:ci-only-test-password@localhost:5432/hive_e2e?sslmode=disable
      PGPASSWORD: ci-only-test-password
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build frontend
        env:
          HIVE_API_INTERNAL_URL: https://api.example.invalid
        run: npm run build
      - name: Build API and migrate a fresh database
        run: |
          (cd backend && go build -o "$RUNNER_TEMP/api" ./cmd/api && go build -o "$RUNNER_TEMP/migrate" ./cmd/migrate)
          psql -h localhost -U postgres -c 'CREATE DATABASE hive_e2e'
          "$RUNNER_TEMP/migrate" up
      - name: Proxy preserves cookies, client-IP trust, CSRF checks and security headers
        run: API_BIN="$RUNNER_TEMP/api" scripts/staging/proxy-e2e.sh
      - name: Hostinger Caddy-edge proxy mode preserves per-client limits
        run: HIVE_SITE_EDGE=caddy API_BIN="$RUNNER_TEMP/api" scripts/staging/proxy-e2e.sh

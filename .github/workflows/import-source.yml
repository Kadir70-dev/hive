name: Import Hive Society Source
on:
  push:
    paths:
      - import/hive-source.zip
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract full project source
        run: python3 scripts/import_source.py
      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: import Hive Society Next.js and Go source"
            git push origin HEAD:main
          fi
